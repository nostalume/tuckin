name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.88.0 fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.88.0 test --locked
