name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked
      - run: cargo +1.88.0 build --locked --release
      - name: Package and test the executable
        shell: pwsh
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: ./.github/package.ps1 -Tag $env:GITHUB_REF_NAME -Platform $env:PACKAGE_PLATFORM
      - run: cp install.sh install.ps1 dist/
        if: matrix.platform == 'linux-x86_64'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/tuckin-*
            dist/install.*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release and its Scoop manifest
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          zip=tuckin-windows-x86_64.zip
          archives=("$zip" tuckin-linux-x86_64.tar.gz tuckin-macos-aarch64.tar.gz)
          hash=$(sha256sum "$zip" | cut -d' ' -f1)
          jq -n --arg version "${tag#v}" --arg url "$GITHUB_SERVER_URL/$GH_REPO/releases/download/$tag/$zip" \
            --arg hash "$hash" --arg homepage "$GITHUB_SERVER_URL/$GH_REPO" '{
              version: $version, homepage: $homepage, license: "Apache-2.0",
              description: "Manage dotfiles across machines",
              architecture: {"64bit": {url: $url, hash: $hash}}, bin: "tuckin.exe"
            }' > tuckin.json
          assets=("${archives[@]}" install.sh install.ps1 tuckin.json)
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$tag" --verify-tag --generate-notes "${assets[@]}" SHA256SUMS
