name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked
      - run: cargo +1.88.0 build --locked --release
      - name: Package and test the executable
        shell: pwsh
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: ./.github/package.ps1 -Tag $env:GITHUB_REF_NAME -Platform $env:PACKAGE_PLATFORM
      - run: cp install.sh install.ps1 dist/
        if: matrix.platform == 'linux-x86_64'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/tuckin-*
            dist/install.*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          assets=(tuckin-windows-x86_64.zip tuckin-linux-x86_64.tar.gz tuckin-macos-aarch64.tar.gz install.sh install.ps1)
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$tag" --verify-tag --generate-notes "${assets[@]}" SHA256SUMS

  scoop:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: scoop-manifest
      queue: max
    steps:
      - name: Update Scoop manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUCKET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          path="repos/$GH_REPO/contents/tuckin.json"
          current=$(gh api "$path" --method GET -f "ref=$BUCKET_BRANCH")
          manifest=$(jq -er '.content' <<< "$current" | base64 -d | jq -e .)
          previous=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$manifest")
          if [[ $(printf '%s\n' "$previous" "$version" | sort -V | tail -n 1) != "$version" ]]; then
            printf 'Scoop already has %s.\n' "$previous"
            exit 0
          fi

          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$tag/tuckin-windows-x86_64.zip"
          hash=$(gh api "repos/$GH_REPO/releases/tags/$tag" | jq -er --arg tag "$tag" --arg url "$url" '
            select(.tag_name == $tag and .draft == false and .prerelease == false)
            | .assets[]
            | select(.browser_download_url == $url and .state == "uploaded")
            | .digest | strings | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")
          ')
          updated=$(jq --arg version "$version" --arg url "$url" --arg hash "$hash" '
            .version = $version | .architecture["64bit"] |= (.url = $url | .hash = $hash)
          ' <<< "$manifest")
          if [[ $updated == "$manifest" ]]; then
            printf 'Scoop already has %s.\n' "$version"
            exit 0
          fi

          content=$(printf '%s\n' "$updated" | base64 -w0)
          gh api "$path" --method PUT -f "branch=$BUCKET_BRANCH" -f "message=Update Scoop manifest to $tag" \
            -f "sha=$(jq -er '.sha' <<< "$current")" -f "content=$content" --jq '.commit.html_url'
